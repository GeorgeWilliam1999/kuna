<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Kuna: a marten (kuna, in Slovak) biting through the LHC ring. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18223d"/>
      <stop offset="1" stop-color="#080b14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="spark-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <g transform="translate(-28 0)">
    <!-- the ring, bitten through at the upper right -->
    <g transform="rotate(-21 540 600)">
      <circle cx="540" cy="600" r="180" fill="none" stroke="#4d8dff" stroke-width="54" stroke-dasharray="1052 79" opacity="0.55" filter="url(#glow)"/>
      <circle cx="540" cy="600" r="180" fill="none" stroke="#4d8dff" stroke-width="46" stroke-dasharray="1052 79"/>
      <circle cx="540" cy="600" r="180" fill="none" stroke="#b9d2ff" stroke-width="5" stroke-dasharray="1052 79" opacity="0.8"/>
    </g>

    <!-- sparks from the cut -->
    <g transform="translate(706 478)">
      <circle r="30" fill="#ffb000" opacity="0.7" filter="url(#spark-glow)"/>
      <path d="M0 -40 L8 -8 L40 0 L8 8 L0 40 L-8 8 L-40 0 L-8 -8 Z" fill="#ffd36b"/>
    </g>

    <!-- the marten on top of the ring, biting it: drawn facing right on y=0, then placed -->
    <g transform="translate(421 435) rotate(-5) scale(1.1) translate(-29 0)">
      <!-- far legs -->
      <path d="M176 -40 C180 -26 184 -14 186 -4 L186 0 L212 0 C212 -6 206 -8 202 -10 C200 -20 200 -30 200 -36 Z" fill="#4a290f"/>
      <path d="M40 -52 C58 -58 76 -56 84 -48 C80 -36 72 -28 66 -22 C64 -14 64 -8 66 -2 L68 0 L40 0 C38 -6 40 -12 44 -18 C34 -28 32 -40 40 -52 Z" fill="#4a290f"/>
      <!-- tail, held out behind -->
      <path d="M-12 -104 C-52 -124 -96 -130 -128 -148 C-146 -160 -156 -176 -152 -194 C-174 -178 -180 -150 -164 -130 C-144 -106 -96 -90 -56 -84 C-40 -82 -30 -82 -24 -86 Z" fill="#6e4019"/>
      <!-- body and head, the head bent down to bite -->
      <path d="M-15 -100
               C10 -122 50 -136 90 -136
               C130 -136 162 -128 182 -118
               C204 -108 224 -92 236 -74
               C246 -62 254 -46 258 -28
               C262 -12 264 6 264 24
               C256 30 246 30 240 26
               C236 16 232 6 226 -2
               C220 -10 216 -16 210 -24
               C190 -46 150 -58 100 -58
               C60 -58 30 -52 10 -50
               C-12 -52 -28 -70 -28 -86
               C-26 -92 -22 -96 -15 -100 Z" fill="#ad6c33"/>
      <!-- near legs -->
      <path d="M194 -44 C198 -30 200 -16 202 -4 L202 0 L232 0 C232 -6 226 -8 222 -10 C220 -18 220 -24 220 -28 C210 -34 200 -38 194 -44 Z" fill="#6e4019"/>
      <path d="M2 -58 C22 -64 44 -62 56 -54 C52 -42 42 -34 32 -30 C30 -20 30 -10 32 -4 L36 0 L12 0 C12 -8 14 -16 16 -26 C2 -32 -4 -44 2 -58 Z" fill="#6e4019"/>
      <!-- throat bib -->
      <path d="M240 26 C236 16 232 6 226 -2 C220 -10 216 -16 210 -24 C214 -36 222 -44 232 -46 C240 -28 248 -6 254 20 C250 26 245 28 240 26 Z" fill="#f3dfb2"/>
      <!-- ear, eye, nose -->
      <path d="M216 -84 C212 -102 222 -116 236 -114 C244 -102 242 -88 234 -78 Z" fill="#8a5326"/>
      <path d="M222 -86 C220 -98 226 -108 234 -106 C238 -98 236 -90 230 -84 Z" fill="#e9cf9c"/>
      <circle cx="250" cy="-24" r="6.5" fill="#1b1209"/>
      <circle cx="262" cy="23" r="7" fill="#1b1209"/>
    </g>
  </g>
</svg>
